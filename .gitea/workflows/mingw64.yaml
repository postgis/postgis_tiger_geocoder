name: MinGW64 Build
on: [push, pull]

env:
  OS_BUILD: "64"

jobs:
  pg-matrix:
    runs-on: windows-mingw64
    strategy:
      matrix:
        pg_ver: ['19']
      fail-fast: false

    steps:
      # Step 0: Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Stage 1: PG Start
      - name: PG Start
        shell: bash
        env:
          PG_VER: ${{ matrix.pg_ver }}
        run: |
          "${GITHUB_WORKSPACE}/ci/winnie/pg_init_start.sh"

      # Stage 2: Test
      - name: Test
        shell: bash
        env:
          PG_VER: ${{ matrix.pg_ver }}
        run: |
          "${GITHUB_WORKSPACE}/ci/winnie/regress.sh"
