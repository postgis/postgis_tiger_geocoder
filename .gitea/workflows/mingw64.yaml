name: MinGW64 Build
on: [push, pull]

env:
  OS_BUILD: "64"
  WORKSPACE: ${{ github.workspace }}

jobs:
  pg-matrix:
    runs-on: windows-mingw64
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    strategy:
      matrix:
        pg_ver: ['18']
      fail-fast: false

    steps:
      # Step 0: Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Stage 1: PG Start
      - name: PG Start
        env:
          PG_VER: ${{ matrix.pg_ver }}
        run: |
          "${WORKSPACE}/ci/winnie/pg_init_start.sh"

      # Stage 2: Test
      - name: Test
        env:
          PG_VER: ${{ matrix.pg_ver }}
        run: |
          "${WORKSPACE}/ci/winnie/regress.sh"
