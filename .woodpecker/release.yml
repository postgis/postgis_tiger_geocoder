when:
  event: tag

variables:
  test-image: &test-image repo.osgeo.org/postgis/build-test:debian13

clone:
  git:
    image: woodpeckerci/plugin-git
    depth: 0

steps:

  release:
    image: *test-image
    commands:
      - sh scripts/release.sh "$${CI_COMMIT_TAG}"

  publish:
    image: woodpeckerci/plugin-release
    depends_on:
      - release
    settings:
      api_key:
        from_secret: GITEA_TOKEN
      title: release_title.txt
      target: main
      note: release_notes.md
      checksum:
        - sha256
      files:
        - postgis_tiger_geocoder-pg*.tar.gz
