when:
  event: tag

variables:
  test-image: &test-image repo.osgeo.org/postgis/build-test:debian13

clone:
  git:
    image: woodpeckerci/plugin-git
    depth: 0

steps:

  build-package:
    image: *test-image
    commands:
      - export PATH=/usr/lib/postgresql/16/bin:$${PATH}
      - pg_config --version
      - TG_VER=$$(grep default postgis_tiger_geocoder.control | cut -f2 -d'=' | tr -d "' ")
      - >-
        for PGVER in 16 17 18 19; do
        export PATH=/usr/lib/postgresql/$${PGVER}/bin:$${PATH};
        pg_config --version;
        make clean;
        make;
        pkg=postgis_tiger_geocoder-pg$${PGVER}-$${TG_VER};
        rm -rf "$${pkg}" "$${pkg}.tar.gz";
        mkdir -p "$${pkg}/share/extension";
        echo "POSTGIS_TIGER_GEOCODER: $${TG_VER} https://gitea.osgeo.org/postgis/postgis_tiger_geocoder.git" > "$${pkg}/version.txt";
        cp *.control "$${pkg}/share/extension/";
        cp data/*.sql "$${pkg}/share/extension/";
        cp README.md "$${pkg}/";
        tar -czf "$${pkg}.tar.gz" "$${pkg}";
        rm -rf "$${pkg}";
        done

  release-notes:
    image: *test-image
    commands:
      - >-
        sed -n "/^# $${CI_COMMIT_TAG}/,/^# /{ /^# $${CI_COMMIT_TAG}/d; /^#/d; p; }"
        NEWS.md > release_notes.md

  publish:
    image: woodpeckerci/plugin-release
    depends_on:
      - build-package
      - release-notes
    settings:
      api_key:
        from_secret: GITEA_TOKEN
      title: $${CI_COMMIT_TAG}
      target: main
      note: release_notes.md
      checksum:
        - sha256
      files:
        - postgis_tiger_geocoder-pg16-$${CI_COMMIT_TAG}.tar.gz
        - postgis_tiger_geocoder-pg17-$${CI_COMMIT_TAG}.tar.gz
        - postgis_tiger_geocoder-pg18-$${CI_COMMIT_TAG}.tar.gz
        - postgis_tiger_geocoder-pg19-$${CI_COMMIT_TAG}.tar.gz
